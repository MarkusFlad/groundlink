[package]
name = "groundlink"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Actors for CCSDS Space Packets, ECSS PUS-C and the SLE services RAF and FCLTU over TCP, built on kameo and tokio"
repository = "https://github.com/MarkusFlad/groundlink"
documentation = "https://markusflad.github.io/groundlink/"
readme = "README.md"
keywords = ["ccsds", "pus", "sle", "space", "actor"]
categories = ["aerospace::space-protocols", "network-programming", "asynchronous"]
exclude = [".github", ".vscode"]

[features]
# `TestActor` and `GetMessages`, for the tests of applications.
test-util = []

[dependencies]
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures = "0.3"
kameo = { version = "0.22", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1.44"

[dev-dependencies]
# The crate's own tests and doctests use `TestActor`.
groundlink = { path = ".", features = ["test-util"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
