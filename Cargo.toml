[package]
name = "kameo-tcp-example"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
futures = "0.3"
kameo = "0.22"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
